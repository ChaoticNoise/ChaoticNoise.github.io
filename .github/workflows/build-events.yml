# Regenerates events.json and feed.xml from events.yml and commits them,
# so the only file anyone edits to add a gig is events.yml.
name: Build events

on:
  push:
    branches: [master]
    paths:
      - events.yml
      - scripts/build_events.py
      - event_fliers/**
      - .github/workflows/build-events.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-events
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Generate events.json and feed.xml
        run: python scripts/build_events.py

      - name: Commit generated files
        id: commit
        run: |
          if git diff --quiet -- events.json feed.xml; then
            echo "Nothing changed."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json feed.xml
          git commit -m "Regenerate events.json and feed.xml from events.yml"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the built-in token may not trigger a Pages rebuild,
      # so request one explicitly.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
