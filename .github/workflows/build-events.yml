# Regenerates thumbs/, events.json and feed.xml from events.yml and the
# images, and commits them, so the only file anyone edits to add a gig is
# events.yml (plus dropping the flier into event_fliers/).
name: Build events

on:
  push:
    branches: [master]
    paths:
      - events.yml
      - scripts/**
      - event_fliers/**
      - images/**
      - .github/workflows/build-events.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-events
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so thumbnails come out byte-identical run to run
      - name: Install PyYAML and Pillow
        run: pip install pyyaml==6.0.1 pillow==12.3.0

      - name: Generate thumbnails
        run: python scripts/build_thumbnails.py

      - name: Generate events.json and feed.xml
        run: python scripts/build_events.py

      - name: Commit generated files
        id: commit
        run: |
          git add -A thumbs events.json feed.xml
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate thumbnails, events.json and feed.xml"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with the built-in token may not trigger a Pages rebuild,
      # so request one explicitly.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
