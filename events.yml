# Chaotic Noise events — the ONE place to add or change a gig.
#
# The website's event list (events.json) and the RSS feed (feed.xml) are
# generated from this file automatically by a GitHub Action whenever it
# changes. Don't edit events.json or feed.xml by hand.
#
# To add a gig, copy this block to the bottom of the list and fill it in:
#
# - title: Name of the Event
#   date: 2026-10-31           # YYYY-MM-DD
#   time: 8:00 PM
#   url: https://link-to-event-page
#   location: Venue, Seattle, WA
#   map: https://maps.app.goo.gl/...
#   flier: 20261031_Event_Name.jpg   # a file in the event_fliers/ folder (optional)
#
# Order doesn't matter; events are sorted by date. Upcoming vs. past is
# worked out automatically. If a title contains ": " or starts with a
# special character, wrap it in "double quotes".
#
# "id" only appears on old events whose RSS id predates this file; leave it
# off new events.

